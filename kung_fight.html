<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IRON LOTUS — cinematic kung-fu loop</title>
<style>
  html,body{margin:0;height:100%;background:#050408;display:flex;align-items:center;justify-content:center;overflow:hidden}
  canvas{width:100vw;height:auto;max-height:100vh;aspect-ratio:16/9;display:block}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
window.__err = null;
window.addEventListener('error', e => { window.__err = e.message; });

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 960, H = 540, GROUND = 440;
const LOOP = 8.6;
const S = 1.2; // fighter scale

/* ---------------- easing ---------------- */
const easeInOut = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p+2,3)/2;
const easeOut   = p => 1 - Math.pow(1-p,3);
const easeIn    = p => p*p*p;
const EASE = { inOut: easeInOut, out: easeOut, in: easeIn, lin: p => p };
const lerp = (a,b,p) => a + (b-a)*p;

/* ---------------- poses (local space, y UP, +x = facing) ---------------- */
const POSES = {
  stand:   {hip:[0,54], chest:[3,94], head:[6,114],  elbowF:[17,76],handF:[28,84], elbowB:[4,80],handB:[16,88], kneeF:[13,28],footF:[19,2],  kneeB:[-11,27],footB:[-17,2]},
  crouch:  {hip:[0,40], chest:[4,76], head:[8,94],   elbowF:[18,62],handF:[28,70], elbowB:[4,66],handB:[15,74], kneeF:[16,20],footF:[19,2],  kneeB:[-14,18],footB:[-18,2]},
  jab:     {hip:[4,54], chest:[12,94],head:[16,114], elbowF:[32,88],handF:[46,90], elbowB:[4,80],handB:[16,88], kneeF:[15,28],footF:[21,2],  kneeB:[-12,27],footB:[-18,2]},
  cross:   {hip:[8,54], chest:[16,94],head:[20,114], elbowF:[14,78],handF:[24,84], elbowB:[34,88],handB:[48,90],kneeF:[17,28],footF:[23,2],  kneeB:[-10,27],footB:[-16,2]},
  frontkick:{hip:[-2,54],chest:[-6,94],head:[-4,114],elbowF:[-10,78],handF:[-14,88],elbowB:[-14,80],handB:[-4,90],kneeF:[24,54],footF:[48,60], kneeB:[-12,27],footB:[-18,2]},
  kicklow: {hip:[-2,54],chest:[-6,94],head:[-6,114], elbowF:[-10,78],handF:[-12,88],elbowB:[-16,80],handB:[-8,90],kneeF:[26,40],footF:[34,24], kneeB:[-12,27],footB:[-18,2]},
  kichigh: {hip:[-2,56],chest:[-8,96],head:[-10,116],elbowF:[-12,80],handF:[-16,92],elbowB:[-18,82],handB:[-10,94],kneeF:[28,64],footF:[44,84],kneeB:[-12,28],footB:[-18,2]},
  dodge:   {hip:[-6,50],chest:[-16,88],head:[-18,106],elbowF:[-4,72],handF:[10,84],elbowB:[-14,74],handB:[-2,86],kneeF:[10,26],footF:[16,2], kneeB:[-14,26],footB:[-20,2]},
  hit:     {hip:[-4,52],chest:[-14,90],head:[-22,108],elbowF:[14,74],handF:[26,96],elbowB:[-16,72],handB:[-22,92],kneeF:[12,28],footF:[18,2],kneeB:[-10,27],footB:[-16,2]},
  hit2:    {hip:[-8,48],chest:[-20,84],head:[-30,102],elbowF:[12,70],handF:[24,92],elbowB:[-20,68],handB:[-28,88],kneeF:[14,26],footF:[20,2],kneeB:[-8,26],footB:[-14,2]},
  flykick: {hip:[0,44], chest:[10,80],head:[16,98],  elbowF:[24,74],handF:[36,82], elbowB:[-16,76],handB:[-26,86],kneeF:[22,44],footF:[40,52],kneeB:[-14,30],footB:[-24,40]},
  fall:    {hip:[0,40], chest:[4,74], head:[10,92],  elbowF:[18,78],handF:[30,92], elbowB:[-18,70],handB:[-30,84],kneeF:[14,24],footF:[26,10],kneeB:[-14,24],footB:[-26,10]},
  down:    {hip:[2,10], chest:[-20,12],head:[-36,14],elbowF:[-14,20],handF:[-26,26],elbowB:[6,18],handB:[16,22], kneeF:[12,22],footF:[24,30], kneeB:[-6,18],footB:[-16,24]},
  victor:  {hip:[0,54], chest:[3,94], head:[6,114],  elbowF:[10,74],handF:[2,62],  elbowB:[14,82],handB:[22,92], kneeF:[12,28],footF:[18,2],  kneeB:[-11,27],footB:[-17,2]},
};
const PT_KEYS = ['hip','chest','head','elbowF','handF','elbowB','handB','kneeF','footF','kneeB','footB'];

function lerpPose(a, b, e) {
  const o = {};
  for (const k of PT_KEYS) o[k] = [lerp(a[k][0], b[k][0], e), lerp(a[k][1], b[k][1], e)];
  return o;
}
function poseAt(keys, t) {
  if (t <= keys[0][0]) return POSES[keys[0][1]];
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, n0] = keys[i], [t1, n1] = keys[i+1];
    if (t >= t0 && t <= t1) {
      const p = (t - t0) / Math.max(1e-6, t1 - t0);
      const e = (EASE[keys[i+1][2]] || easeInOut)(p);
      return lerpPose(POSES[n0], POSES[n1], e);
    }
  }
  return POSES[keys[keys.length-1][1]];
}

/* ---------------- timeline helpers ---------------- */
// piecewise lerp over [t, v] stops
function pw(stops, t, ease) {
  if (t <= stops[0][0]) return stops[0][1];
  for (let i = 0; i < stops.length - 1; i++) {
    const [t0, v0] = stops[i], [t1, v1] = stops[i+1];
    if (t >= t0 && t <= t1) return lerp(v0, v1, (ease || easeInOut)((t-t0)/(t1-t0)));
  }
  return stops[stops.length-1][1];
}
function seg(t, a, b, e) { return t < a ? 0 : t > b ? 1 : (e || easeInOut)((t-a)/(b-a)); }

/* ---------------- fighter A (white gi, red band) — faces right ---------------- */
const aX = t => t < 3.75 ? 350 : t < 3.95 ? lerp(350,322,seg(t,3.75,3.95))
  : t < 4.9 ? 322 : t < 5.0 ? lerp(322,308,seg(t,4.9,5.0))
  : t < 5.35 ? 308 : t < 5.45 ? lerp(308,298,seg(t,5.35,5.45))
  : t < 5.75 ? 298 : t < 5.85 ? lerp(298,290,seg(t,5.75,5.85))
  : t < 6.15 ? 290 : t < 6.95 ? lerp(290,240,(t-6.15)/0.8)
  : 240;
const aYoff = t => { const p = (t-6.15)/0.8; return (t>6.15 && t<6.95) ? 4*80*p*(1-p) : 0; };
const aRot  = t => (t>6.15 && t<6.95) ? -5.4*seg(t,6.15,6.95,easeIn) : 0;
const aFlashHits = [1.85, 3.75, 4.95, 5.35, 5.75, 6.45];
const aFlash = t => Math.max(0, ...aFlashHits.map(h => 1 - Math.abs(t-h)/0.16));

const A = {
  face: 1,
  keys: [
    [0,'stand'],[1.15,'stand'],[1.35,'jab','out'],[1.55,'stand'],[2.0,'stand'],
    [2.35,'frontkick','out'],[2.7,'stand'],[3.0,'crouch'],[3.25,'kicklow','out'],
    [3.5,'kichigh','out'],[3.75,'stand'],[3.95,'hit','out'],[4.3,'hit2','out'],
    [4.7,'crouch'],[4.95,'hit','out'],[5.15,'hit'],[5.35,'hit2','out'],[5.55,'hit'],
    [5.75,'hit2','out'],[6.05,'crouch'],[6.15,'fall'],[6.85,'fall'],[6.95,'down','out'],[8.6,'down']
  ],
  x: aX, yoff: aYoff, rot: aRot, flash: aFlash,
  gi: '#ece2cd', giDark: '#c9bda2', belt: '#b3372a', band: '#c0392b', skin: '#e8b98a',
  ghostWin: [6.15, 6.95], ghostCol: 'rgba(200,60,40,0.5)'
};

/* ---------------- fighter B (dark gi, cream band) — faces left ---------------- */
const bX = t => t < 1.4 ? 610 : t < 1.85 ? lerp(610,588,seg(t,1.4,1.85))
  : t < 2.2 ? lerp(588,610,seg(t,1.85,2.2)) : t < 3.5 ? 610
  : t < 3.8 ? lerp(610,596,seg(t,3.5,3.8)) : t < 4.3 ? 596
  : t < 4.85 ? lerp(596,606,seg(t,4.3,4.85)) : t < 5.2 ? 606
  : t < 5.6 ? lerp(606,566,seg(t,5.2,5.6)) : t < 6.12 ? 566
  : t < 6.85 ? lerp(566,412,(t-6.12)/0.73) : t < 7.4 ? lerp(412,440,seg(t,6.85,7.4))
  : 440;
const bYoff = t => { const p = (t-6.12)/0.73; return (t>6.12 && t<6.85) ? 4*72*p*(1-p) : 0; };
const bRot  = t => (t>3.55 && t<4.0) ? 6.28*seg(t,3.55,4.0) : (t>6.12 && t<6.85) ? -0.45*Math.sin(((t-6.12)/0.73)*Math.PI) : 0;
const bFlashHits = [1.7, 3.4];
const bFlash = t => Math.max(0, ...bFlashHits.map(h => 1 - Math.abs(t-h)/0.16));

const B = {
  face: -1,
  keys: [
    [0,'stand'],[1.35,'stand'],[1.55,'dodge','out'],[1.85,'cross','out'],[2.15,'stand'],
    [2.6,'crouch'],[3.0,'dodge','out'],[3.45,'crouch'],[3.65,'kicklow','out'],
    [3.8,'kichigh','out'],[4.05,'stand'],[4.85,'stand'],[4.95,'jab','out'],[5.15,'stand'],
    [5.35,'jab','out'],[5.55,'stand'],[5.75,'cross','out'],[6.0,'stand'],
    [6.12,'flykick','out'],[6.8,'flykick'],[6.9,'crouch','out'],[7.3,'victor'],[8.6,'victor']
  ],
  x: bX, yoff: bYoff, rot: bRot, flash: bFlash,
  gi: '#39414f', giDark: '#2a303b', belt: '#d9d2bf', band: '#e6e1d3', skin: '#e8b98a',
  ghostWin: [3.55, 4.0], ghostCol: 'rgba(120,160,255,0.5)'
};

/* ---------------- impact events ---------------- */
const IMPACTS = [
  {t:1.85, x:368, y:308, size:1.0, shake:6,  flash:0.10, lines:0},
  {t:3.75, x:330, y:352, size:1.9, shake:16, flash:0.30, lines:16},
  {t:4.95, x:316, y:356, size:0.9, shake:5,  flash:0.07, lines:0},
  {t:5.35, x:306, y:356, size:0.9, shake:5,  flash:0.07, lines:0},
  {t:5.75, x:298, y:356, size:1.1, shake:8,  flash:0.12, lines:8},
  {t:6.45, x:262, y:330, size:2.3, shake:22, flash:0.40, lines:22},
  {t:6.90, x:244, y:438, size:1.4, shake:12, flash:0.10, lines:0, dust:true},
];

/* ---------------- FX state ---------------- */
let bursts = [], lines = [], dusts = [], ghosts = [], petals = [];
let shake = 0, screenFlash = 0;
for (let i = 0; i < 16; i++) petals.push({
  x: Math.random()*W, y: Math.random()*H, vx: -12-Math.random()*18, vy: 10+Math.random()*14,
  rot: Math.random()*6.3, vr: (Math.random()-.5)*2, s: 2.5+Math.random()*3, ph: Math.random()*6.3
});

function fireImpact(imp, tNow) {
  bursts.push({x:imp.x, y:imp.y, t0:tNow, size:imp.size});
  if (imp.dust) for (let i = 0; i < 7; i++) dusts.push({x:imp.x+(Math.random()-.5)*30, y:GROUND-4, t0:tNow, s:8+Math.random()*14});
  for (let i = 0; i < imp.lines; i++) {
    const a = Math.random()*Math.PI*2;
    lines.push({x:imp.x, y:imp.y, a, len:90+Math.random()*220*imp.size, t0:tNow});
  }
  shake = Math.max(shake, imp.shake);
  screenFlash = Math.max(screenFlash, imp.flash);
}

/* ---------------- fighter drawing ---------------- */
function limb(c, pa, pb, w, col) {
  c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round';
  c.beginPath(); c.moveTo(pa[0],pa[1]); c.lineTo(pb[0],pb[1]); c.stroke();
}
function drawFighter(f, t, ox, oRot, oyoff, cols, alpha) {
  const pose = poseAt(f.keys, t);
  const d = f.face, s = S;
  const hip = pose.hip;
  const x = ox !== undefined ? ox : f.x(t);
  const yoff = oyoff !== undefined ? oyoff : f.yoff(t);
  const rot = oRot !== undefined ? oRot : f.rot(t);
  const C = cols || f;
  const bob = Math.sin(t*2.1 + (f.face>0?0:2)) * 1.5;
  ctx.save();
  ctx.globalAlpha = alpha !== undefined ? alpha : 1;
  // shadow
  const sh = Math.max(0.35, 1 - yoff/240);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(x, GROUND+5, 44*sh, 9*sh, 0, 0, Math.PI*2); ctx.fill();

  ctx.translate(x, GROUND - hip[1]*s - yoff);
  ctx.rotate(rot);
  const P = pt => [(pt[0]-hip[0])*d*s, -(pt[1]-hip[1])*s];
  const hipP = P(hip), chP = P([pose.chest[0], pose.chest[1]+bob]), hdP = P([pose.head[0], pose.head[1]+bob]);
  const eF = P(pose.elbowF), hF = P(pose.handF), eB = P(pose.elbowB), hB = P(pose.handB);
  const kF = P(pose.kneeF), fF = P(pose.footF), kB = P(pose.kneeB), fB = P(pose.footB);

  // back arm, back leg
  limb(ctx, chP, eB, 9*s*0.75, C.giDark); limb(ctx, eB, hB, 7*s*0.75, C.skin);
  limb(ctx, hipP, kB, 11*s*0.8, C.giDark); limb(ctx, kB, fB, 8*s*0.8, C.giDark);
  ctx.fillStyle = C.belt; ctx.beginPath(); ctx.arc(fB[0], fB[1], 3.5, 0, Math.PI*2); ctx.fill();
  // torso
  limb(ctx, hipP, chP, 15*s, C.gi);
  // belt
  ctx.strokeStyle = C.belt; ctx.lineWidth = 5*s*0.7;
  ctx.beginPath(); ctx.moveTo(hipP[0]-8*d, hipP[1]-3); ctx.lineTo(hipP[0]+8*d, hipP[1]-1); ctx.stroke();
  // head + band + ribbons
  ctx.fillStyle = C.skin;
  ctx.beginPath(); ctx.arc(hdP[0], hdP[1], 10.5*s*0.9, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = C.band; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(hdP[0], hdP[1], 10.5*s*0.9, -2.2, 0.6); ctx.stroke();
  const flap = Math.sin(t*7 + (f.face>0?0:3))*3;
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(hdP[0]-10*d, hdP[1]-2);
  ctx.quadraticCurveTo(hdP[0]-22*d, hdP[1]-6+flap, hdP[0]-30*d, hdP[1]-2+flap*1.6);
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(hdP[0]-10*d, hdP[1]-1);
  ctx.quadraticCurveTo(hdP[0]-20*d, hdP[1]+4-flap, hdP[0]-27*d, hdP[1]+8-flap*1.4);
  ctx.stroke();
  // front leg, front arm
  limb(ctx, hipP, kF, 11*s, C.gi); limb(ctx, kF, fF, 8*s, C.gi);
  ctx.fillStyle = C.belt; ctx.beginPath(); ctx.arc(fF[0], fF[1], 3.5, 0, Math.PI*2); ctx.fill();
  limb(ctx, chP, eF, 9*s, C.gi); limb(ctx, eF, hF, 7*s, C.skin);
  ctx.fillStyle = C.skin; ctx.beginPath(); ctx.arc(hF[0], hF[1], 3.5, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
const WHITE = {gi:'#fff', giDark:'#fff', belt:'#fff', band:'#fff', skin:'#fff'};

/* ---------------- background ---------------- */
let skyGrad, vigGrad, grainC;
(function init(){
  skyGrad = ctx.createLinearGradient(0,0,0,H);
  skyGrad.addColorStop(0,'#0b0a1a'); skyGrad.addColorStop(0.45,'#1a1530');
  skyGrad.addColorStop(0.75,'#3a2038'); skyGrad.addColorStop(1,'#0d0a10');
  vigGrad = ctx.createRadialGradient(W/2,H/2,H*0.35, W/2,H/2,H*0.85);
  vigGrad.addColorStop(0,'rgba(0,0,0,0)'); vigGrad.addColorStop(1,'rgba(0,0,0,0.55)');
  grainC = document.createElement('canvas'); grainC.width = grainC.height = 140;
  const g = grainC.getContext('2d');
  const img = g.createImageData(140,140);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random()*255|0;
    img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=255;
  }
  g.putImageData(img,0,0);
})();

function drawBG(t, camX) {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = skyGrad; ctx.fillRect(0,0,W,H);
  const off = (camX - W/2);
  // moon
  const mx = 700 - off*0.03, my = 118;
  const mg = ctx.createRadialGradient(mx,my,10, mx,my,110);
  mg.addColorStop(0,'rgba(255,240,214,0.9)'); mg.addColorStop(0.25,'rgba(255,235,200,0.25)'); mg.addColorStop(1,'rgba(255,235,200,0)');
  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx,my,110,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#f5ead2'; ctx.beginPath(); ctx.arc(mx,my,42,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(200,185,160,0.35)';
  ctx.beginPath(); ctx.arc(mx-12,my-8,7,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx+14,my+12,5,0,Math.PI*2); ctx.fill();
  // mountains
  ctx.fillStyle = '#141127';
  ctx.beginPath(); ctx.moveTo(0,300);
  for (let x = 0; x <= W+40; x += 40) {
    const y = 260 - 60*Math.sin((x+off*0.05)*0.008) - 30*Math.sin((x+off*0.05)*0.021+2);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W,320); ctx.lineTo(0,320); ctx.fill();
  ctx.fillStyle = '#0e0c1c';
  ctx.beginPath(); ctx.moveTo(0,340);
  for (let x = 0; x <= W+40; x += 40) {
    const y = 310 - 45*Math.sin((x+off*0.12)*0.011+1) - 20*Math.sin((x+off*0.12)*0.027);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W,380); ctx.lineTo(0,380); ctx.fill();
}

function drawFloor(t) {
  const g = ctx.createLinearGradient(0,GROUND,0,640);
  g.addColorStop(0,'#221a20'); g.addColorStop(1,'#0b080c');
  ctx.fillStyle = g; ctx.fillRect(-200,GROUND,1400,300);
  ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
  for (let i = -2; i < 16; i++) {
    const x0 = i*80;
    ctx.beginPath(); ctx.moveTo(x0, GROUND);
    ctx.lineTo(x0 + (x0-480)*0.25, 640); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  for (const yy of [GROUND+8, GROUND+26, GROUND+52, GROUND+88]) {
    ctx.beginPath(); ctx.moveTo(-200,yy); ctx.lineTo(1200,yy); ctx.stroke();
  }
  // moonlight pool
  ctx.fillStyle = 'rgba(200,200,255,0.04)';
  ctx.beginPath(); ctx.ellipse(480, GROUND+40, 340, 46, 0, 0, Math.PI*2); ctx.fill();
}

function drawLantern(x, t, ph) {
  ctx.save();
  ctx.translate(x, 40);
  ctx.rotate(Math.sin(t*0.7+ph)*0.05);
  ctx.strokeStyle = 'rgba(60,45,40,0.9)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,90); ctx.stroke();
  const g = ctx.createRadialGradient(0,112,4, 0,112,60);
  g.addColorStop(0,'rgba(255,170,80,0.55)'); g.addColorStop(1,'rgba(255,170,80,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,112,60,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#e8933c';
  ctx.beginPath(); ctx.ellipse(0,112,13,18,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#7a4a1c';
  ctx.fillRect(-8,93,16,5); ctx.fillRect(-8,128,16,5);
  ctx.restore();
}

function drawMist(t) {
  ctx.fillStyle = 'rgba(180,180,220,0.05)';
  for (let i = 0; i < 4; i++) {
    const x = ((i*280 + t*12) % (W+400)) - 200;
    ctx.beginPath(); ctx.ellipse(x, GROUND-6+i*6, 220, 34, 0, 0, Math.PI*2); ctx.fill();
  }
}

/* ---------------- FX drawing ---------------- */
function drawFX(tNow) {
  // bursts
  for (let i = bursts.length-1; i >= 0; i--) {
    const b = bursts[i], age = tNow - b.t0;
    if (age > 0.35) { bursts.splice(i,1); continue; }
    const p = age/0.35;
    ctx.save(); ctx.translate(b.x,b.y);
    ctx.strokeStyle = `rgba(255,240,200,${(1-p)*0.9})`;
    ctx.lineWidth = 3*b.size*(1-p);
    const n = 8;
    for (let k = 0; k < n; k++) {
      const a = (k/n)*Math.PI*2 + p*0.4;
      const r0 = 8 + p*30*b.size, r1 = r0 + (34+40*b.size)*(1-p*0.5);
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*r0, Math.sin(a)*r0);
      ctx.lineTo(Math.cos(a)*r1, Math.sin(a)*r1); ctx.stroke();
    }
    ctx.fillStyle = `rgba(255,255,255,${(1-p)*0.85})`;
    ctx.beginPath(); ctx.arc(0,0, (10+30*b.size)*(1-p)*0.7 + 2, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = `rgba(255,200,120,${(1-p)*0.5})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0,0, 20+p*90*b.size, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  // speed lines
  for (let i = lines.length-1; i >= 0; i--) {
    const l = lines[i], age = tNow - l.t0;
    if (age > 0.28) { lines.splice(i,1); continue; }
    const p = age/0.28;
    const r0 = 30+p*60, r1 = r0 + l.len*(1-p);
    ctx.strokeStyle = `rgba(255,255,255,${(1-p)*0.5})`; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(l.x+Math.cos(l.a)*r0, l.y+Math.sin(l.a)*r0);
    ctx.lineTo(l.x+Math.cos(l.a)*r1, l.y+Math.sin(l.a)*r1);
    ctx.stroke();
  }
  // dust
  for (let i = dusts.length-1; i >= 0; i--) {
    const d = dusts[i], age = tNow - d.t0;
    if (age > 0.8) { dusts.splice(i,1); continue; }
    const p = age/0.8;
    ctx.fillStyle = `rgba(160,140,130,${(1-p)*0.3})`;
    ctx.beginPath(); ctx.arc(d.x + p*20*(i%2?1:-1), d.y - p*10, d.s*(1+p*1.5), 0, Math.PI*2); ctx.fill();
  }
}

function drawPetals(t) {
  for (const p of petals) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = 'rgba(240,180,195,0.75)';
    ctx.beginPath(); ctx.ellipse(0,0,p.s,p.s*0.45,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

/* ---------------- camera & main loop ---------------- */
const camZoom = t => t < 2 ? lerp(1.0,1.06,seg(t,0,2)) : t < 3.7 ? lerp(1.06,1.14,seg(t,2,3.7))
  : t < 5.8 ? lerp(1.14,1.06,seg(t,3.7,5.8)) : lerp(1.06,0.94,seg(t,5.8,8.4));
const camX = t => (A.x(t)+B.x(t))/2 + 10;
const camY = t => 330;

function rate(t) {
  if (t >= 3.45 && t < 4.35) return 0.3;   // slow-mo on the spin kick
  if (t >= 6.3  && t < 6.95) return 0.45;  // slow-mo on the flying finisher
  return 1;
}

const startT = parseFloat(new URLSearchParams(location.search).get('t')) || 0;
let choreo = startT, last = null, fired = new Set();
if (startT > 0) { for (const imp of IMPACTS) if (imp.t < startT) fired.add(imp.t); }

function frame(ts) {
  if (last === null) last = ts;
  const dt = Math.min((ts-last)/1000, 0.1); last = ts;
  const prevT = choreo;
  choreo = (choreo + dt*rate(choreo)) % LOOP;
  const t = choreo;

  // fire impacts; reset on loop wrap
  if (t < prevT) fired.clear();
  for (const imp of IMPACTS) {
    if (!fired.has(imp.t) && imp.t >= startT && t >= imp.t) { fired.add(imp.t); fireImpact(imp, t); }
  }

  shake *= Math.pow(0.001, dt); // fast decay
  screenFlash = Math.max(0, screenFlash - dt*2.2);
  const shx = (Math.random()-.5)*shake, shy = (Math.random()-.5)*shake;

  // petals (screen space, drift with time)
  for (const p of petals) {
    p.x += (p.vx + Math.sin(t*1.3+p.ph)*8) * dt;
    p.y += p.vy * dt; p.rot += p.vr*dt;
    if (p.y > H+10) { p.y = -10; p.x = Math.random()*W; }
    if (p.x < -10) p.x = W+10;
  }

  // ghosts (afterimages)
  for (const f of [A,B]) {
    const [g0,g1] = f.ghostWin;
    if (t > g0 && t < g1 && t > g1 - 0.35) ghosts.push({f, x:f.x(t), rot:f.rot(t), yoff:f.yoff(t), t, age:0});
  }
  for (let i = ghosts.length-1; i >= 0; i--) { ghosts[i].age += dt; if (ghosts[i].age > 0.26) ghosts.splice(i,1); }

  /* ---- render ---- */
  drawBG(t, camX(t));

  const z = camZoom(t);
  ctx.setTransform(z,0,0,z, W/2 - camX(t)*z + shx, H/2 - camY(t)*z + shy);

  drawFloor(t);
  drawLantern(130, t, 0);
  drawLantern(830, t, 2.1);
  drawMist(t);

  // ghosts under fighters (pose frozen at ghost spawn time)
  for (const g of ghosts) {
    drawFighter(g.f, g.t, g.x, g.rot, g.yoff,
      {gi:g.f.ghostCol, giDark:g.f.ghostCol, belt:g.f.ghostCol, band:g.f.ghostCol, skin:g.f.ghostCol},
      (1 - g.age/0.26)*0.22);
  }
  drawFighter(B, t);
  if (B.flash(t) > 0) drawFighter(B, t, undefined, undefined, undefined, WHITE, B.flash(t)*0.8);
  drawFighter(A, t);
  if (A.flash(t) > 0) drawFighter(A, t, undefined, undefined, undefined, WHITE, A.flash(t)*0.8);

  drawFX(t);

  /* ---- post (screen space) ---- */
  ctx.setTransform(1,0,0,1,0,0);
  drawPetals(t);
  // color grade
  ctx.fillStyle = 'rgba(20,10,40,0.12)'; ctx.fillRect(0,0,W,H);
  // grain
  ctx.globalAlpha = 0.05;
  const rx = Math.random()*140|0, ry = Math.random()*140|0;
  for (let x = -rx; x < W; x += 140) for (let y = -ry; y < H; y += 140) ctx.drawImage(grainC, x, y);
  ctx.globalAlpha = 1;
  // vignette
  ctx.fillStyle = vigGrad; ctx.fillRect(0,0,W,H);
  // screen flash
  if (screenFlash > 0) { ctx.fillStyle = `rgba(255,250,240,${screenFlash})`; ctx.fillRect(0,0,W,H); }
  // letterbox
  const bar = 44;
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,W,bar); ctx.fillRect(0,H-bar,W,bar);
  // title
  const ta = Math.min(seg(t,0.4,1.4), 1 - seg(t,7.4,8.3));
  if (ta > 0.01) {
    ctx.globalAlpha = ta*0.9;
    ctx.fillStyle = '#d8c9a3';
    ctx.font = '600 15px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('I R N   L T S   ·   鉄 蓮', W/2, bar/2 + 5);
    ctx.globalAlpha = 1;
  }
  // loop fade
  const fade = t < 0.45 ? 1 - t/0.45 : t > 8.15 ? (t-8.15)/0.45 : 0;
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${Math.min(1,fade)})`; ctx.fillRect(0,0,W,H); }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
